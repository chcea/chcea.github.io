<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>OCEAN</title>
        <audio id="Musica" loop>
            <source src="SpongeBob.mp3" type="audio/mpeg">
        </audio>
        <style>

            body {
                background: #000d1a;
                color: white;
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 30px;
            }

            h1 {
                font-size: 36px;
                color: #00ccff;
                margin-bottom: 16px;
            }

            #mar {
                border: 2px solid #003366;
                border-radius: 10px;
            }

            a {
                color: #00ccff;
                font-size: 16px;
                text-decoration: none;
                margin-top: 20px;
                border: 1px solid #00ccff;
                padding: 10px 20px;
                border-radius: 8px;
            }

            a:hover {
                background: #00ccff;
                color: #001122;
            }

        </style>
    </head>
        <body style="background: #001122; color: white;">
            
            <H1> EL OCEANO glu glu glu glu 🫧</H1>


            <canvas id="mar" width="1000" height="600"
            style="border: 2px solid #003366; display: block;">
            </canvas>
            
            <br>
            <a href="index.html" style="color: lightblue;">VOLVER A DIBUJAR</a>
            <a href="acuario.html" style="color: lightblue;">VER ACUARIO</a>

            <script>
                document.addEventListener("click", function() {
                    var musica = document.getElementById("Musica");
                    if (musica.paused) {
                        musica.play();
                    } else {
                        musica.pause();
                    }
                });
                document.getElementById("Musica").play();

                var mar = document.getElementById("mar");
                var ctx = mar.getContext("2d");

                var listaGuardada = localStorage.getItem("listaPeces");
                var lista = listaGuardada ? JSON.parse(listaGuardada) : [];

                var peces = [];

                for (var i = 0; i < lista.length; i++) {
                    var img = new Image();
                    img.src = lista[i];
                    peces.push({
                        imagen: img,
                        x: Math.random() * (mar.width - 50),
                        y: Math.random() * (mar.height - 50),
                        velocidad: 1 + Math.random() * 2
                        
                    });
                    };
                function animar() {
                    ctx.clearRect(0, 0, mar.width, mar.height);
                    ctx.fillStyle = "#001a33";
                    ctx.fillRect(0, 0, mar.width, mar.height);

                    for (var i = 0; i < peces.length; i++) {
                        var pez = peces[i];
                        pez.x = pez.x + pez.velocidad;
                        if (pez.x > mar.width) {
                            pez.x = -100;
                        }
                        ctx.drawImage(pez.imagen, pez.x, pez.y, 100, 70);
                        }

                        requestAnimationFrame(animar);
                }

                animar();
            </script>
        </body>

</html>
